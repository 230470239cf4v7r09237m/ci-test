name: Test Priority Runner
on:
  workflow_dispatch:
  merge_group:
  pull_request:

jobs:
  pr-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: echo "PR check passed"

  test:
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: tt-ubuntu-2204-n300-prio-stable
    steps:
      - run: echo "Runner accepted the job"
