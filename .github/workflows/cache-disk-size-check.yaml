name: Cache disk size check (MINFRA-1616)
# Temp verification for the per-runnerset cache-disk resize. Runs directly on the runner VM
# (not in a container) so df shows the guest's /var/lib/containerd disk. Expect ~150G once the
# xlarge set is patched to DISK_SIZE=150G + the pr-1541 sandbox image (was ~100G before). Delete after.
on:
  workflow_dispatch: {}
jobs:
  df-check:
    runs-on: tt-ubuntu-2204-xlarge-stable
    steps:
      - name: containerd disk size
        run: |
          echo "=== full df ==="
          df -h
          echo "=== /var/lib/containerd (the cache disk) ==="
          df -h /var/lib/containerd
          findmnt /var/lib/containerd || true
