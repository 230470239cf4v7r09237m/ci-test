name: Hourly business hour test
 
on:
  workflow_dispatch: 
  pull_request:
    branches: ["*"]
  schedule:
    # Run at 9am-5pm austin time Monday-Friday (17:00 UTC)
    - cron: "0 15-23 * * 1-5"
jobs:
  ################################################
  # Test Open MPI download via restricted proxy
  ################################################
  test-open-mpi-allowlist:
    runs-on: tt-ubuntu-2204-small-stable
    steps:
      - name: Fetch Open MPI release via restricted proxy
        run: |
          curl -fsSL -o /tmp/openmpi.tgz \
            https://download.open-mpi.org/release/open-mpi/v5.0/openmpi-5.0.10.tar.gz
          ls -lh /tmp/openmpi.tgz

  ################################################
  # Run ls on an cpu-only runner
  ################################################
  run-ls-cpu-only:
    runs-on: tt-beta-ubuntu-2204-mnijjar
    strategy:
      matrix:
        version_x: [0,1]
        version_y: [0,1]
    steps:
      - run: ls -la /local_repos
      - run: ls -la /files-from-host
      - run: echo $GITHUB_EVENT_PATH
      - run: cat $GITHUB_EVENT_PATH
      - run: echo "🎉 This job uses runner scale set runners in a vm!"
      - run: ls -al /
      - run: echo $USER
