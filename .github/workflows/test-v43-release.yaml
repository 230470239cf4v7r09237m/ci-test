name: Test N300

on:
  workflow_dispatch:
  pull_request:
    branches: ["*"]

jobs:
  test-n300-standard:
    runs-on: tt-ubuntu-2204-n300-stable
    steps:
      - name: Verify tt-smi version
        run: tt-smi --version | grep -E "^4\."   # confirms v4.0.0 is installed

      - name: Verify card is visible via tt-smi
        run: tt-smi -ls | grep n300              # confirms smi can enumerate the card

      - name: Verify KMD is loaded
        run: lsmod | grep tenstorrent            # confirms KMD loaded by tt-ansible tooling

      - name: Verify tt-flash is available
        run: tt-flash --version                  # confirms flash tooling is present

  test-n300-viommu:
    runs-on: tt-ubuntu-2204-n300-viommu-stable
    steps:
      - name: Verify tt-smi version
        run: tt-smi --version | grep -E "^4\."

      - name: Verify card is visible via tt-smi
        run: tt-smi -ls | grep n300

      - name: Verify KMD is loaded
        run: lsmod | grep tenstorrent
