name: Cache guest check
# Runs INSIDE the runner VM. Answers: is the docker cache disk mounted at /var/lib/containerd,
# and did the guest's docker inherit the seeded tt-metal images? Delete after.
on:
  workflow_dispatch: {}
jobs:
  guest-check:
    runs-on: tt-ubuntu-2204-large-stable
    steps:
      - name: cache disk + seeded images in the guest
        run: |
          echo "=== /var/lib/containerd mount (expect a ~100G disk, ~36G used, if cache is mounted) ==="
          df -h /var/lib/containerd 2>&1 || true
          findmnt /var/lib/containerd 2>&1 || true
          echo
          echo "=== docker images (expect the 7 seeded tt-metal images if cache reached the guest) ==="
          docker images 2>&1 | head -40
          echo
          echo "=== docker root/storage ==="
          docker info 2>&1 | grep -iE "Storage Driver|Docker Root Dir|Images:|Server Version" || true
